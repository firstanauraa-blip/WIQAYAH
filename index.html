<style>
:root{
  /* layout: satu kolom sempit seperti layar HP; linimasa media sosial sebagai panggung permainan */
  --paper:#eef2ec; --surface:#ffffff; --ink:#12302a; --muted:#56675f; --line:#d5ded6;
  --leaf:#1d7558; --leaf-soft:#dcefe5; --accent:#d9971c; --accent-soft:#fbefd4;
  --danger:#b8432a; --danger-soft:#f8e1da;
  --display:"Unbounded",system-ui,sans-serif; --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --arab:"Amiri","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1714; --surface:#15231e; --ink:#e6eee9; --muted:#9db0a7; --line:#28392f;
  --leaf:#4cc093; --leaf-soft:#173a2d; --accent:#f0b73e; --accent-soft:#3a2e12;
  --danger:#e47a5f; --danger-soft:#3d1f17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0d1714; --surface:#15231e; --ink:#e6eee9; --muted:#9db0a7; --line:#28392f;
  --leaf:#4cc093; --leaf-soft:#173a2d; --accent:#f0b73e; --accent-soft:#3a2e12;
  --danger:#e47a5f; --danger-soft:#3d1f17; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:540px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:21px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{font:600 15px var(--body);border-radius:12px;padding:13px 18px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:active{transform:scale(.99)}
.opt{display:block;width:100%;text-align:left;font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--leaf)}
.opt.good{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.bad{border-color:var(--danger);background:var(--danger-soft)}
.opt[disabled]{cursor:default}
.tag{display:inline-block;font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.tag.gold{background:var(--accent-soft);color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0 16px}
.steps span{height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--leaf)}
.steps span.now{background:var(--accent)}
.hero{padding:20px 0 8px}
.arab{font-family:var(--arab);font-size:56px;line-height:1;color:var(--leaf);direction:rtl}
.wordmark{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--muted)}
.sebar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sebar div{border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;background:var(--surface)}
.sebar b{display:block;font-family:var(--display);font-size:22px;color:var(--muted)}
.sebar small{display:block;font-size:11px;color:var(--muted);line-height:1.2;margin-top:2px}
.sebar div.got{border-color:var(--accent);background:var(--accent-soft)}
.sebar div.got b{color:var(--accent)}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.phone-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ava{width:38px;height:38px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font:700 14px var(--display);color:#1d1503;flex:none}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.meter small{display:block;font-size:12px;color:var(--muted)}
.meter strong{font:700 20px var(--display);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .6s ease}
.mission{padding:14px;border-bottom:1px solid var(--line);background:var(--accent-soft)}
.feed{padding:14px;display:flex;flex-direction:column;gap:10px}
.post-art{border-radius:12px;padding:14px;font-weight:600;margin-bottom:6px}
.bubble{background:var(--leaf-soft);border-radius:4px 16px 16px 16px;padding:12px 14px;max-width:92%}
.bubble .from{font-size:12px;color:var(--leaf);font-weight:700;margin-bottom:4px}
.reveal{border-left:4px solid var(--accent);background:var(--surface);border-radius:0 14px 14px 0;padding:14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.reveal.bad{border-left-color:var(--danger)}
.dalil{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--leaf-soft);font-size:14px}
.dalil b{color:var(--leaf)}
.big{font:700 44px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.footer{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.5}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:translateY(6px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}
</style>
</head>

const PHASES=["pre","jebak","tabayun","sikap","post"];
let S;
function fresh(){return {screen:"home",pre:[],post:[],qi:0,lv:0,picked:null,badges:[],followers:120,cred:40,ci:0,cq:0,cAns:[],cScore:0,si:0,sPick:null,sScore:0,lvWins:0};}
function start(d){S=(d&&d.screen)?d:fresh();render();}
window.claude?.hot?.snapshot?.(()=>S);
function set(p){Object.assign(S,p);render();window.scrollTo({top:0,behavior:"smooth"});}
const $=h=>{document.getElementById("app").innerHTML=h;};
function steps(cur){const i=cur==="done"?PHASES.length:PHASES.indexOf(cur);return `<div class="steps" aria-hidden="true">${PHASES.map((p,j)=>`<span class="${j<i?"on":j===i?"now":""}"></span>`).join("")}</div>`;}
function sebarStrip(){return `<div class="sebar">${SEBAR.map(x=>`<div class="${S.badges.includes(x.k)?"got":""}"><b>${x.k}</b><small>${x.n}</small></div>`).join("")}</div>`;}
function fmt(n){return new Intl.NumberFormat("id-ID").format(Math.round(n));}

function render(){({home,quiz,jebak,tabayun,sikap,result})[S.screen]();}

     <div class="row"><span class="tag">Babak 1 · Jebak</span><span>Jadi admin akun yang menormalisasi tren fiktif</span></div>
     <div class="row"><span class="tag">Babak 2 · Tabayun</span><span>Teliti kabar dengan tiga langkah</span></div>
     <div class="row"><span class="tag">Babak 3 · Sikap</span><span>Tegas pada nilai, santun pada orang</span></div>
     <div class="row"><span class="tag">Tes akhir</span><span>Lihat peningkatan imunitasmu</span></div>
    </div>
   </div>
   <button class="btn" onclick="set({screen:'quiz',qi:0,pre:[]})">Mulai tes awal</button>
   <p class="footer">Prototipe esai WIQĀYAH, AWF 2026. Dirancang berdasarkan teori inokulasi (McGuire, 1961; Roozenbeek &amp; van der Linden, 2019), perintah tabayun (QS al-Ḥujurāt: 6), dan sikap Nabi Luth (QS asy-Syuʿarā’: 168). Semua kasus di Babak 1 adalah fiktif.</p>
  </div>`);
}

function quiz(){
 const isPost=S.pre.length===5; const bank=isPost?POST:PRE; const item=bank[S.qi];
 const phase=isPost?"post":"pre";
 $(`${steps(phase)}<div class="stack pop">
  <span class="tag ${isPost?"gold":""}">${isPost?"Tes akhir":"Tes awal"} · ${S.qi+1}/5</span>
  <h2>Trik apa yang dipakai unggahan ini?</h2>
  <div class="bubble"><div class="from">Unggahan di linimasa</div>${item.t}</div>
  <div class="stack">${SEBAR.map(x=>`<button class="opt" onclick="answerQuiz('${x.k}')"><b>${x.k}</b> · ${TECH[x.k]}</button>`).join("")}</div>
  <p class="small muted">Jawabanmu baru dinilai di akhir permainan.</p></div>`);
}
function answerQuiz(k){
 const isPost=S.pre.length===5; const arr=isPost?S.post:S.pre; arr.push(k);
 if(S.qi<4){set({qi:S.qi+1});}
 else if(!isPost){set({screen:"jebak",lv:0,picked:null,qi:0});}
 else{set({screen:"result"});}
}

function jebak(){
 const L=LEVELS[S.lv]; const credPct=Math.min(100,S.cred);
 const picked=S.picked;
 const optsHtml=L.opts.map((o,i)=>{
   let cls="opt"; if(picked!==null){ if(o.win) cls+=" good"; else if(i===picked) cls+=" bad";}
   const art=o.art==="pastel"?`<div class="post-art" style="background:#f6d9e6;color:#5b2340">#ContekBareng · maskot burung hantu · ♪ lo-fi</div>`:"";
   return `<button class="${cls}" ${picked!==null?"disabled":""} onclick="pickLevel(${i})">${art}${o.txt}</button>`;}).join("");
 let reveal="";
 if(picked!==null){
  const win=L.opts[picked].win;
  reveal=`<div class="reveal ${win?"":"bad"} pop stack">
   <div class="row"><span class="tag gold">Lencana ${L.k} · ${TECH[L.k]}</span></div>
   <p>${win?"Viral! Kamu baru saja memakai trik ini.":"Kurang viral. Trik yang lebih ampuh ada di pilihan yang ditandai hijau."}</p>
   <p><b>Cara kerjanya:</b> ${L.how}</p>
   <p class="muted"><b>Di dunia nyata:</b> ${L.transfer}</p>
   <div class="dalil">${L.dalil}</div>
   <button class="btn" onclick="nextLevel()">${S.lv<4?"Lanjut ke misi berikutnya":"Selesai, lanjut ke Babak 2"}</button></div>`;
 }
 $(`${steps("jebak")}<div class="stack">
  <div class="row" style="justify-content:space-between"><span class="tag">Babak 1 · Jebak · Misi ${S.lv+1}/5</span></div>
  <p class="small muted">Peranmu: admin akun yang ingin membuat tren fiktif #ContekBareng (mencontek massal saat ujian) terlihat wajar. Dengan memainkan perannya, kamu belajar mengenali triknya.</p>
  <div class="phone">
   <div class="phone-top"><div class="ava">KK</div><div><b>@kontenkilat</b><div class="small muted">Akun pembuat tren</div></div></div>
   <div class="meters">
    <div class="meter"><small>Pengikut</small><strong>${fmt(S.followers)}</strong></div>
    <div class="meter"><small>Kesan meyakinkan</small><strong>${Math.round(credPct)}%</strong><div class="bar"><i style="width:${credPct}%"></i></div></div>
   </div>
   <div class="mission"><b>Misi:</b> ${L.mission}</div>
   <div class="feed">${optsHtml}</div>
  </div>
  ${reveal}
  ${sebarStrip()}
 </div>`);
}
function pickLevel(i){
 const L=LEVELS[S.lv]; const win=L.opts[i].win;
 const badges=S.badges.includes(L.k)?S.badges:[...S.badges,L.k];
 set({picked:i,badges,followers:S.followers*(win?3.4:1.25)+(win?850:40),cred:Math.min(100,S.cred+(win?12:2)),lvWins:S.lvWins+(win?1:0)});
}
function nextLevel(){ if(S.lv<4) set({lv:S.lv+1,picked:null}); else set({screen:"tabayun",ci:0,cq:0,cAns:[]}); }

function tabayun(){
 const C=CASES[S.ci]; const done=S.cAns.length;
 const qs=C.q.map((q,qi)=>{
   if(qi>done) return "";
   const ans=S.cAns[qi];
   return `<div class="card stack"><b class="small">${q.ask}</b>${q.o.map((o,oi)=>{
     let cls="opt"; if(ans!==undefined){ if(oi===q.a) cls+=" good"; else if(oi===ans) cls+=" bad";}
     return `<button class="${cls}" ${ans!==undefined?"disabled":""} onclick="answerStep(${qi},${oi})">${o}</button>`;}).join("")}</div>`;}).join("");
 let actHtml="";
 if(done>=3){
  const ans=S.cAns[3];
  actHtml=`<div class="card stack"><b class="small">Keputusan: apa yang kamu lakukan?</b>${C.act.o.map((o,oi)=>{
   let cls="opt"; if(ans!==undefined){ if(oi===C.act.a) cls+=" good"; else if(oi===ans) cls+=" bad";}
   return `<button class="${cls}" ${ans!==undefined?"disabled":""} onclick="answerStep(3,${oi})">${o}</button>`;}).join("")}</div>`;
  if(ans!==undefined){
   actHtml+=`<div class="reveal ${ans===C.act.a?"":"bad"} pop stack"><p>${C.lesson}</p><div class="dalil">${C.dalil}</div>
   <button class="btn" onclick="nextCase()">${S.ci<3?"Kabar berikutnya":"Selesai, lanjut ke Babak 3"}</button></div>`;}
 }
 $(`${steps("tabayun")}<div class="stack">
  <span class="tag">Babak 2 · Tabayun · Kabar ${S.ci+1}/4</span>
  <h2>Teliti dulu, baru bersikap</h2>
  <div class="phone"><div class="feed"><div class="bubble"><div class="from">${C.from}</div>${C.msg}</div></div></div>
  ${qs}${actHtml}
 </div>`);
}
function answerStep(qi,oi){
 const C=CASES[S.ci]; const correct=qi<3?C.q[qi].a===oi:C.act.a===oi;
 const cAns=[...S.cAns]; cAns[qi]=oi;
 S.cAns=cAns; S.cScore+=correct?1:0; render();
}
function nextCase(){ if(S.ci<3) set({ci:S.ci+1,cAns:[]}); else set({screen:"sikap",si:0,sPick:null}); }

function sikap(){
 const X=SIKAP[S.si]; const p=S.sPick;
 $(`${steps("sikap")}<div class="stack">
  <span class="tag">Babak 3 · Sikap · Situasi ${S.si+1}/3</span>
  <h2>Tegas pada nilai, santun pada orang</h2>
  <div class="card"><p>${X.sit}</p></div>
  <div class="stack">${X.o.map((o,i)=>{let cls="opt"; if(p!==null){ if(o.good) cls+=" good"; else if(i===p) cls+=" bad";}
    return `<button class="${cls}" ${p!==null?"disabled":""} onclick="pickSikap(${i})">${o.t}</button>`;}).join("")}</div>
  ${p!==null?`<div class="reveal ${X.o[p].good?"":"bad"} pop stack"><p>${X.o[p].why}</p>${X.o[p].good?"":`<p class="muted small">Sikap terbaik: ${X.o.find(o=>o.good).why}</p>`}
   <button class="btn" onclick="nextSikap()">${S.si<2?"Situasi berikutnya":"Lanjut ke tes akhir"}</button></div>`:""}
 </div>`);
}
function pickSikap(i){ set({sPick:i,sScore:S.sScore+(SIKAP[S.si].o[i].good?1:0)}); }
function nextSikap(){ if(S.si<2) set({si:S.si+1,sPick:null}); else set({screen:"quiz",qi:0}); }

function result(){
 const pre=S.pre.filter((k,i)=>k===PRE[i].a).length;
 const post=S.post.filter((k,i)=>k===POST[i].a).length;
 const diff=post-pre;
 const imun=Math.round(((post/5)*0.5+(S.cScore/16)*0.3+(S.sScore/3)*0.2)*100);
 const verdict=imun>=80?"Kebal kuat":imun>=60?"Cukup kebal":"Perlu dosis penguat";
 const rows=POST.map((x,i)=>`<div class="row small" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:8px"><span style="flex:1;min-width:0">${x.t}</span><span class="tag ${S.post[i]===x.a?"":"gold"}">${S.post[i]===x.a?"Tepat":"Jawaban: "+x.a}</span></div>`).join("");
 $(`${steps("done")}<div class="stack pop">
  <span class="tag gold">Hasil imunitas</span>
  <h1>${verdict}</h1>
  <div class="card stack"><small class="muted">Skor imunitas WIQĀYAH</small><div class="big">${imun}<span style="font-size:20px">/100</span></div><div class="bar"><i style="width:${imun}%"></i></div></div>
  <div class="score-row">
   <div class="card"><small class="muted">Tes awal</small><div class="big">${pre}/5</div></div>
   <div class="card"><small class="muted">Tes akhir</small><div class="big">${post}/5</div><small class="${diff>=0?"":"muted"}" style="color:${diff>0?"var(--leaf)":"var(--muted)"}">${diff>0?"Naik "+diff+" poin":diff===0?"Tetap":"Turun "+Math.abs(diff)+" poin"}</small></div>
  </div>
  <div class="score-row">
   <div class="card"><small class="muted">Langkah tabayun tepat</small><div class="big" style="font-size:30px">${S.cScore}/16</div></div>
   <div class="card"><small class="muted">Sikap tepat</small><div class="big" style="font-size:30px">${S.sScore}/3</div></div>
  </div>
  <div class="card stack"><h3>Pembahasan tes akhir</h3>${rows}</div>
  <div class="card stack"><h3>Kartu saku SEBAR milikmu</h3>${sebarStrip()}
   <p class="small"><b>3 langkah tabayun:</b> siapa sumbernya, apa buktinya, apa dampaknya jika disebar.</p>
   <p class="small"><b>Pegangan sikap:</b> “Aku membenci perbuatanmu” (QS asy-Syuʿarā’: 168). Tolak perbuatannya, jaga martabat manusianya.</p></div>
  <button class="btn" onclick="set(fresh())">Main lagi</button>
  <p class="footer">Efek inokulasi bisa memudar seiring waktu, jadi ulangi permainan ini atau tonton episode “Vaksin 60 Detik” sebagai dosis penguat.</p>
 </div>`);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
